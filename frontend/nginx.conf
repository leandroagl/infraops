server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ACME challenge para certbot (primer deploy y renovaciones)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Avatares de usuarios: proxy al backend
    # ^~ es necesario: sin esto, el regex de assets estáticos de abajo (que matchea
    # .jpg/.png) le gana a este prefix match sin importar el orden en el archivo
    location ^~ /avatars/ {
        proxy_pass http://backend:3000/avatars/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets estáticos: cache agresivo (Angular genera hashes en los nombres)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy: stripea /api/ y forwarda al backend interno
    # /api/auth/login → http://backend:3000/auth/login
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: todas las rutas de Angular sirven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
