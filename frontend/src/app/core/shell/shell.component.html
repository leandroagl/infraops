<div class="shell-outer">

  <!-- ── Toolbar (full width) ────────────────────────────────── -->
  <mat-toolbar class="shell-toolbar">
    <svg viewBox="0 0 24 24"
         style="width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0">
      <rect x="2" y="3" width="20" height="14" rx="2"/>
      <path d="M8 21h8M12 17v4"/>
    </svg>
    <span class="toolbar__title">InfraOps</span>
    <span class="toolbar__spacer"></span>
    <button mat-button class="toolbar__user-btn" [matMenuTriggerFor]="userMenu">
      <span class="toolbar__user-content">
        <span class="toolbar__user-info">
          <span class="toolbar__user-role">{{ currentUser?.role }}</span>
          <span class="toolbar__user-name">{{ currentUser?.name }}</span>
        </span>
        <app-user-avatar
          [name]="currentUser?.name ?? ''"
          [avatarUrl]="currentUser?.avatarUrl ?? null"
          size="md">
        </app-user-avatar>
        <svg viewBox="0 0 24 24"
             style="width:10px;height:10px;stroke:var(--tx-lo);fill:none;stroke-width:2;flex-shrink:0">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </span>
    </button>

    <mat-menu #userMenu="matMenu" xPosition="before">
      <div class="user-menu__header" (click)="$event.stopPropagation()">
        <span class="user-menu__name">{{ currentUser?.name }}</span>
        <span class="user-menu__email">{{ currentUser?.email }}</span>
        <span class="user-menu__role">{{ currentUser?.role }}</span>
      </div>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="goToProfile()">
        <svg viewBox="0 0 24 24"
             style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Mi perfil
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item class="user-menu__logout" (click)="logout()">
        <svg viewBox="0 0 24 24"
             style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Cerrar sesión
      </button>
    </mat-menu>
  </mat-toolbar>

  <mat-sidenav-container class="shell">

    <!-- ── Sidenav ───────────────────────────────────────────── -->
    <mat-sidenav mode="side" opened [class.sidenav--wide]="clientContext">
      <div class="sidebar__wrapper">

        <!-- MODO CLIENTE -->
        <ng-container *ngIf="clientContext; else globalNav">
          <a class="client-nav-item client-nav-item--back"
             routerLink="/clients"
             title="Volver a Clientes">
            <svg viewBox="0 0 24 24"
                 style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
            <span class="client-nav-item__label">Clientes</span>
          </a>

          <div class="sidebar__divider"></div>

          <nav class="sidebar__nav sidebar__nav--client">
            <a class="client-nav-item"
               [routerLink]="['/clients', clientContext.id, 'overview']"
               routerLinkActive="active"
               title="Overview">
              <svg viewBox="0 0 24 24"
                   style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round">
                <rect x="3" y="3" width="7" height="7" rx="1"/>
                <rect x="14" y="3" width="7" height="7" rx="1"/>
                <rect x="3" y="14" width="7" height="7" rx="1"/>
                <rect x="14" y="14" width="7" height="7" rx="1"/>
              </svg>
              <span class="client-nav-item__label">Overview</span>
            </a>

            <a class="client-nav-item"
               [routerLink]="['/clients', clientContext.id, 'mantenimientos']"
               routerLinkActive="active"
               title="Mantenimientos">
              <svg viewBox="0 0 24 24"
                   style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round">
                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
              </svg>
              <span class="client-nav-item__label">Mantenimientos</span>
            </a>
          </nav>
        </ng-container>

        <!-- MODO GLOBAL -->
        <ng-template #globalNav>
          <nav class="sidebar__nav sidebar__nav--global">
            <a *ngFor="let item of navItems"
               [routerLink]="item.route"
               class="nav-item"
               [class.active]="isActive(item.route)"
               [title]="item.label">

              <svg *ngIf="item.icon === 'dashboard'" viewBox="0 0 24 24"
                   style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0">
                <rect x="3" y="3" width="7" height="7" rx="1"/>
                <rect x="14" y="3" width="7" height="7" rx="1"/>
                <rect x="3" y="14" width="7" height="7" rx="1"/>
                <rect x="14" y="14" width="7" height="7" rx="1"/>
              </svg>

              <svg *ngIf="item.icon === 'tasks'" viewBox="0 0 24 24"
                   style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0">
                <path d="M9 11l3 3L22 4"/>
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
              </svg>

              <svg *ngIf="item.icon === 'clients'" viewBox="0 0 24 24"
                   style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>

              <svg *ngIf="item.icon === 'notifications'" viewBox="0 0 24 24"
                   style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
              </svg>

              <svg *ngIf="item.icon === 'admin'" viewBox="0 0 24 24"
                   style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0">
                <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
                <rect x="9" y="3" width="6" height="4" rx="1"/>
                <path d="M9 12h6M9 16h4"/>
              </svg>

              <svg *ngIf="item.icon === 'schedules'" viewBox="0 0 24 24"
                   style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0">
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <path d="M16 2v4M8 2v4M3 10h18"/>
                <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>
              </svg>

              <svg *ngIf="item.icon === 'docs'" viewBox="0 0 24 24"
                   style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
              </svg>

              <span class="nav-item__label">{{ item.label }}</span>

            </a>
          </nav>
        </ng-template>

      </div><!-- /sidebar__wrapper -->
    </mat-sidenav>

    <!-- ── Content ───────────────────────────────────────────── -->
    <mat-sidenav-content>
      <main class="shell__content">
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>

  </mat-sidenav-container>

</div>
