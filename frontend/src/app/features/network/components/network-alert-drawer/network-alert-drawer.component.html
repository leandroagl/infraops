<div class="ndr">
  <div class="ndr__header">
    <div class="ndr__header-info">
      <span class="ndr__title">{{ client.clientName }}</span>
      <span class="ndr__subtitle">
        {{ client.devices.length }} {{ client.devices.length === 1 ? 'alerta' : 'alertas' }}
        &nbsp;·&nbsp;
        <span class="sev-chip sev-chip--{{ client.severity }}">{{ client.severity }}</span>
      </span>
    </div>
    <button mat-icon-button (click)="drawerClosed.emit()"><mat-icon>close</mat-icon></button>
  </div>

  <div class="ndr__body">
    <mat-table [dataSource]="client.devices" class="ndr__device-table">
      <ng-container matColumnDef="siteName">
        <mat-header-cell *matHeaderCellDef>SITE</mat-header-cell>
        <mat-cell *matCellDef="let d">{{ d.siteName }}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="deviceName">
        <mat-header-cell *matHeaderCellDef>ALERTA</mat-header-cell>
        <mat-cell *matCellDef="let d">{{ d.deviceName }}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="deviceModel">
        <mat-header-cell *matHeaderCellDef>MODELO</mat-header-cell>
        <mat-cell *matCellDef="let d" class="net-model">{{ d.deviceModel }}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="severity">
        <mat-header-cell *matHeaderCellDef>SEV.</mat-header-cell>
        <mat-cell *matCellDef="let d">
          <span class="sev-chip sev-chip--{{ d.severity }}">{{ d.severity }}</span>
        </mat-cell>
      </ng-container>
      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let d; columns: displayedColumns;"></mat-row>
    </mat-table>
  </div>
</div>
