<div class="rdc">

  <!-- Header -->
  <div class="rdc-hdr">
    <div class="rdc-identity">
      <span class="rdc-device-name">{{ deviceLabel }}</span>
      <span class="rdc-device-ip">{{ device.ip ?? '—' }}</span>
    </div>
  </div>

  <div [formGroup]="group">

    <div class="rdc-section-lbl">Firmware</div>

    <mat-checkbox formControlName="firmwareUpdated" class="rdc-check">
      Se actualizó el firmware
    </mat-checkbox>

    <mat-form-field *ngIf="firmwareUpdated"
                    appearance="outline" subscriptSizing="dynamic" class="rdc-form-field rdc-version-field">
      <mat-label>Versión instalada</mat-label>
      <input matInput formControlName="firmwareVersion" placeholder="Ej: 7.14.2" />
    </mat-form-field>

    <div class="rdc-section-lbl">Configuración</div>

    <mat-checkbox formControlName="backupDone" class="rdc-check">
      Backup de configuración realizado
    </mat-checkbox>

  </div>
</div>
