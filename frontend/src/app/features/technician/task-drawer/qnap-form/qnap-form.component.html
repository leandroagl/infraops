<form [formGroup]="form" class="qf">

  <div class="qf-section-lbl">Dispositivos NAS</div>

  <div class="qnap-devices-stack">
    <app-qnap-device-card
      *ngFor="let _ of qnapDeviceControls.controls; let i = index"
      [device]="infrastructure.nas[i]"
      [group]="getQnapGroup(i)"
      [readOnly]="readOnly">
    </app-qnap-device-card>
  </div>

  <div class="qf-section-lbl">Observaciones</div>

  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="qnap-notes-ff">
    <mat-label>Notas</mat-label>
    <textarea matInput formControlName="notes" rows="3"
              placeholder="Observaciones generales..."></textarea>
  </mat-form-field>

</form>
