<!-- Barra de navegación de mes -->
<div class="month-nav-bar">
  <button mat-icon-button class="month-nav-btn" (click)="prevMonth()" aria-label="Mes anterior">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <span class="month-label">{{ monthLabel }}</span>
  <button mat-icon-button class="month-nav-btn" (click)="nextMonth()" [disabled]="isCurrentMonth" aria-label="Mes siguiente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
  <span class="month-nav-sep"></span>
  <span class="month-past-badge" [class.visible]="cycleClosed">Período cerrado</span>
  <span class="month-nav-spacer"></span>
  <button *ngIf="canCreateTask" mat-flat-button color="primary" (click)="openCreateDialog()">
    <mat-icon>add</mat-icon>
    Nueva tarea
  </button>
  <button *ngIf="isAdmin" mat-icon-button (click)="openTasksConfig()" matTooltip="Configuración de tareas">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
</div>

<mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

<!-- Bloque unificado: KPIs + filtros inline + progreso -->
<div class="kpi-filters-block">
  <app-kpi-strip [stats]="stats" [closed]="cycleClosed"
                 [activeStatusFilter]="statusFilter"
                 [activeUnassignedFilter]="unassignedFilter"
                 (statusFilterChange)="onStatusFilterChange($event)"
                 (unassignedFilterChange)="onUnassignedFilterChange($event)">
    <button *ngIf="hasActiveFilters" mat-button class="clear-btn" (click)="clearFilters()">
      <mat-icon>close</mat-icon>
      Limpiar
    </button>
  </app-kpi-strip>

  <div class="cycle-closed-banner" *ngIf="cycleClosed">
    <mat-icon style="font-size:14px;height:14px;width:14px">check_circle</mat-icon>
    Ciclo cerrado — solo lectura
  </div>
</div>

<!-- Error de carga -->
<div *ngIf="error" class="error-banner">
  {{ error }}
  <button mat-button (click)="load()">Reintentar</button>
</div>

<!-- Tabla de tareas agrupadas por cliente -->
<div class="table-scroll" *ngIf="!loading">
  <app-cycle-table
    [groups]="groups"
    [selectedTaskId]="selectedTask?.id ?? null"
    [taskTypes]="taskTypes"
    [technicians]="technicians"
    [taskStatuses]="taskStatuses"
    [clients]="clients"
    [clientFilter]="clientFilter"
    [typeFilter]="typeFilter"
    [techFilter]="techFilter"
    [statusFilter]="statusFilter"
    (taskSelected)="selectTask($event)"
    (clientFilterChange)="onClientFilterChange($event)"
    (typeFilterChange)="onTypeFilterChange($event)"
    (techFilterChange)="onTechFilterChange($event)"
    (statusFilterChange)="onStatusFilterChange($event)">
  </app-cycle-table>
</div>

<!-- Drawer de detalle de tarea -->
<div class="drawer" [class.open]="selectedTask !== null">
  <app-task-drawer
    *ngIf="selectedTask"
    [task]="selectedTask"
    [userRole]="userRole"
    [cycleClosed]="cycleClosed"
    [technicians]="technicians"
    (taskCompleted)="onTaskCompleted()"
    (taskNotDone)="onTaskNotDone()"
    (taskStatusChanged)="onTaskStatusChanged($event)"
    (technicianAssigned)="onTechnicianAssigned($event)"
    (drawerClosed)="closeDrawer()">
  </app-task-drawer>
</div>
